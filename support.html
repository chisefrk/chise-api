<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06080c">
  <title>Support — CHISEFRK API</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <div class="aurora aurora-three"></div>
  <div class="cursor-glow"></div>

  <main>
    <section class="page inner-page">
      <div class="page-head reveal">
        <div>
          <span class="eyebrow">04 / SUPPORT</span>
          <h1>Find the<br><span class="gradient-text">source.</span></h1>
        </div>
      </div>

      <div class="support-grid">
        <a
          class="support-card glass reveal"
          href="https://github.com/chisefrk/chisefrk-api"
          target="_blank"
          rel="noopener"
        >
          <span class="support-icon">◈</span>
          <div>
            <span class="eyebrow">SOURCE</span>
            <h2>GitHub Repository</h2>
            <p>Source code, issues, commits, and project updates.</p>
          </div>
          <span class="support-arrow">↗</span>
        </a>

        <a class="support-card glass reveal" href="./docs.html">
          <span class="support-icon">⌘</span>
          <div>
            <span class="eyebrow">READ</span>
            <h2>Documentation</h2>
            <p>Endpoint structure and usage examples.</p>
          </div>
          <span class="support-arrow">↗</span>
        </a>
      </div>

      <div class="support-note glass reveal">
        <span class="note-symbol">i</span>
        <p>
          CHISEFRK API adalah project personal. Jangan kirim secret,
          token, password, atau data sensitif ke endpoint publik.
        </p>
      </div>
    </section>
  </main>

  <div id="dock"></div>
  <script src="./assets/js/app.js"></script>
</body>
</html>
