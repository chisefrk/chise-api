<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06080c">
  <title>Login — CHISEFRK API</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>
  <div class="aurora aurora-three"></div>
  <div class="cursor-glow"></div>

  <main>
    <section class="page login-page">
      <div class="login-card glass reveal">
        <div class="login-orb">✦</div>

        <span class="eyebrow">PRIVATE AREA</span>
        <h1>There is nothing<br><span class="gradient-text">to log into.</span></h1>

        <p>
          Authentication belum dibutuhkan untuk versi static ini.
          Halaman ini sengaja menjadi placeholder, bukan form login
          palsu yang pura-pura bekerja.
        </p>

        <div class="login-state">
          <span class="status-dot"></span>
          AUTHENTICATION DISABLED
        </div>
      </div>
    </section>
  </main>

  <div id="dock"></div>
  <script src="./assets/js/app.js"></script>
</body>
</html>
